
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b46">
  <title>مساعدي الذكي</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #172b42;
    }
    header {
      background: #102b46;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    main {
      max-width: 700px;
      margin: 20px auto;
      padding: 12px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px #0000000c;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      border: 1px solid #ccd6e0;
      border-radius: 10px;
      font: inherit;
      resize: vertical;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 10px;
      background: #1769aa;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button.secondary { background: #42617c; }
    #answer {
      white-space: pre-wrap;
      line-height: 1.8;
      margin-top: 15px;
    }
    .note { color: #63758a; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 مساعدي الذكي</h1>
    <div>مساعدك العربي الشخصي</div>
  </header>

  <main>
    <section class="card">
      <h2>💬 اسأل مساعدك</h2>
      <textarea id="question" placeholder="اكتب سؤالك هنا..."></textarea>
      <button onclick="reply()">إرسال السؤال</button>
      <button class="secondary" onclick="speak()" >🔊 قراءة الرد</button>
      <div id="answer">مرحباً بك! أنا مساعدك الذكي.</div>
      <p class="note">هذه نسخة أولية بواجهة عربية. سنضيف الذكاء الاصطناعي الحقيقي لاحقاً.</p>
    </section>

    <section class="card">
      <h2>🌱 المساعد الزراعي</h2>
      <p>اسأل عن الزراعة والبيوت البلاستيكية والري والأسمدة.</p>
    </section>

    <section class="card">
      <h2>₿ العملات الرقمية</h2>
      <p>سنضيف متابعة معلومات العملات الرقمية لاحقاً.</p>
    </section>
  </main>

  <script>
    function reply() {
      const q = document.getElementById("question").value.trim();
      const a = document.getElementById("answer");
      if (!q) {
        a.textContent = "اكتب سؤالك أولاً.";
        return;
      }
      a.textContent = "وصل سؤالك: " + q +
        "\nهذه نسخة تجريبية، وسنربطها بخدمة الذكاء الاصطناعي في الخطوة القادمة.";
    }

    function speak() {
      const text = document.getElementById("answer").textContent;
      if ("speechSynthesis" in window) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = "ar";
        speechSynthesis.speak(msg);
      } else {
        alert("ميزة القراءة الصوتية غير مدعومة في هذا المتصفح.");
      }
    }
  </script>
</body>
</html>
